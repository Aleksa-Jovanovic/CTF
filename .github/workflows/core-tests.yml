name: Core tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/CTF.Core.Tests/CTF.Core.Tests.csproj

      - name: Build
        run: dotnet build tests/CTF.Core.Tests/CTF.Core.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/CTF.Core.Tests/CTF.Core.Tests.csproj --configuration Release --no-build